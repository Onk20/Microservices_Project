

server:
  port: ${SERVER_PORT:8081}

spring:

  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
  application:
    name: USERSERVICE
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/microservices}
    username: ${DB_USERNAME:userapp}
    password: ${DB_PASSWORD}





  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

    show-sql: false

    properties :
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka :
  instance :
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}:${random.uuid}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true


resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        ignoreExceptions:
          - com.lcwd.user.service.exceptions.ResouceNotFoundException
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 6s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
