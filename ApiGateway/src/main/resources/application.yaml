server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: USER_SERVICE
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**

        - id: HOTEL_SERVICE
          uri: lb://HOTELSERVICE
          predicates:
              - Path=/hotels/**,/hotel/**,/staffs/**


        - id: RATING_SERVICE
          uri: lb://RATINGSERVICE
          predicates:
              - Path=/ratings/**


eureka :
  instance :
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}:${random.uuid}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never